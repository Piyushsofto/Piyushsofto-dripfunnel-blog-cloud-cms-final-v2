backend:
  name: git-gateway
  repo: piyushsofto/Piyushsofto-dripfunnel-blog-cloud-cms-final-v2
  branch: main

  identity_url: https://auth.dripfunnel.com/sites/d07275d5-a1e0-4195-8237-68b4014c375b
  gateway_url: https://gateway.dripfunnel.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://blog.dripfunnel.com/decapcms-with-bridge.svg

site_url: https://piyushsofto.github.io/Piyushsofto-dripfunnel-blog-cloud-cms-final-v2

media_folder: public/images
public_folder: /images

publish_mode: editorial_workflow

collections:

  - name: "posts"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "slug"
    summary: "{{title}}"
    preview_path: "blog/{{slug}}"

    fields:

      - label: "Slug"
        name: "slug"
        widget: "string"
        required: true
        hint: 'Bare slug only, e.g. "why-website-important"'

      - label: "Title"
        name: "title"
        widget: "string"
        required: true

      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        required: false

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        dateFormat: "YYYY-MM-DD"
        timeFormat: false
        required: true

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Body"
        name: "body"
        widget: "markdown"
        required: true